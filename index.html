<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Bot Spawner</title>
  <style>
    body { font-family: Arial; background: #1e1e2f; color: #0f0; text-align: center; padding: 20px; }
    input, button { padding: 12px; margin: 8px; font-size: 16px; border-radius: 8px; }
    button { background: #00ff00; color: black; border: none; cursor: pointer; }
    button:hover { background: #00cc00; }
    #log { margin-top: 20px; text-align: left; max-height: 600px; overflow-y: auto; background: #111; padding: 15px; border-radius: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <h1>🟢 Kahoot Bot Spawner</h1>
  
  <input type="text" id="pin" placeholder="Kahoot PIN" maxlength="6" value="331060">
  <input type="number" id="count" placeholder="Bots" value="5" min="1" max="20">
  <br><br>
  <button onclick="startBots()">Spawn Bots</button>
  <button onclick="stopBots()">Stop All</button>

  <div id="log"></div>

  <script>
    let bots = [];
    let running = false;

    function log(msg) {
      document.getElementById('log').innerHTML += msg + '<br>';
      document.getElementById('log').scrollTop = 999999;
    }

    function generateName() {
      return "Bot" + Math.floor(Math.random() * 9000 + 1000);
    }

    async function startBots() {
      if (running) return;
      running = true;
      bots = [];
      const pin = document.getElementById('pin').value.trim();
      const count = parseInt(document.getElementById('count').value);

      document.getElementById('log').innerHTML = `Spawning ${count} bots for PIN ${pin}...<br><br>`;

      for (let i = 1; i <= count; i++) {
        setTimeout(() => {
          if (!running) return;
          createBot(pin, i);
        }, i * 800);
      }
    }

    function createBot(pin, id) {
      const name = generateName();
      log(`[Bot ${id}] Trying to join as ${name}...`);

      // This is the most reliable way in browser right now
      fetch(`https://kahoot.it/reserve/session/${pin}/`, { 
        method: 'GET',
        mode: 'no-cors'   // This helps a bit with CORS
      }).then(() => {
        log(`<span style="color:orange">[Bot ${id}] Token request sent (CORS limited)</span>`);
      }).catch(() => {
        log(`<span style="color:red">[Bot ${id}] Failed - CORS blocked</span>`);
      });
    }

    function stopBots() {
      running = false;
      log("🛑 All bots stopped.");
    }
  </script>
</body>
</html>
