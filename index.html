<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Bot Spawner 2026</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #0f0;
      text-align: center;
      padding: 20px;
    }
    input, button {
      padding: 12px;
      margin: 10px;
      font-size: 16px;
      border-radius: 8px;
    }
    button {
      background: #00ff00;
      color: black;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #00cc00; }
    #log {
      margin-top: 20px;
      text-align: left;
      max-height: 500px;
      overflow-y: auto;
      background: #111;
      padding: 15px;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>🟢 Kahoot Bot Spawner (Improved)</h1>
  
  <input type="text" id="pin" placeholder="Enter Kahoot PIN" maxlength="6">
  <input type="number" id="count" placeholder="Number of bots" value="5" min="1" max="50">
  <br>
  <button onclick="startBots()">Spawn Bots</button>
  <button onclick="stopBots()">Stop All Bots</button>

  <div id="log"></div>

  <script>
    let bots = [];
    let running = false;

    function log(message) {
      const logDiv = document.getElementById('log');
      logDiv.innerHTML += message + '\n';
      logDiv.scrollTop = logDiv.scrollHeight;
    }

    function generateName() {
      const names = ["Bot", "Player", "Noob", "KahootKing", "xXBot", "Random", "Guest"];
      return names[Math.floor(Math.random() * names.length)] + Math.floor(Math.random() * 9999);
    }

    async function getSessionToken(pin) {
      try {
        const res = await fetch(`https://kahoot.it/reserve/session/${pin}/?${Date.now()}`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        return data.token || null;
      } catch (e) {
        return null;
      }
    }

    function createBot(pin, id) {
      const name = generateName();
      
      getSessionToken(pin).then(token => {
        if (!token) {
          log(`<span style="color:red">[Bot ${id}] Failed to get session token</span>`);
          return;
        }

        const ws = new WebSocket(`wss://kahoot.it/cometd/${pin}/${token}`);

        ws.onopen = () => {
          log(`<span style="color:cyan">[Bot ${id}]</span> Connected as <b>${name}</b>`);
          
          // Handshake
          ws.send(JSON.stringify([{
            "channel": "/meta/handshake",
            "version": "1.0",
            "supportedConnectionTypes": ["websocket"],
            "id": "1"
          }]));
        };

        ws.onmessage = (event) => {
          try {
            const messages = JSON.parse(event.data);
            if (Array.isArray(messages)) {
              messages.forEach(msg => {
                if (msg.channel === "/meta/handshake" && msg.successful) {
                  // Join game
                  ws.send(JSON.stringify([{
                    "channel": "/service/controller",
                    "data": {
                      "type": "join",
                      "pin": pin,
                      "name": name
                    },
                    "id": "2"
                  }]));
                }
              });
            }
          } catch(e) {}
        };

        ws.onerror = () => log(`<span style="color:red">[Bot ${id}] Connection error</span>`);
        ws.onclose = () => log(`<span style="color:orange">[Bot ${id}] Disconnected</span>`);

        return ws;
      });
    }

    function startBots() {
      if (running) return;
      
      const pin = document.getElementById('pin').value.trim();
      let count = parseInt(document.getElementById('count').value);

      if (!pin || pin.length !== 6) {
        alert("Please enter a valid 6-digit PIN!");
        return;
      }

      running = true;
      bots = [];
      document.getElementById('log').innerHTML = `Spawning ${count} bots for PIN: ${pin}...\n\n`;

      count = Math.min(count, 30); // Limit to reduce detection

      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          if (running) {
            const bot = createBot(pin, i + 1);
            bots.push(bot);
          }
        }, i * 600); // Increased delay
      }
    }

    function stopBots() {
      running = false;
      bots.forEach(bot => {
        if (bot && bot.close) bot.close();
      });
      bots = [];
      log("🛑 All bots stopped.");
    }
  </script>
</body>
</html>
